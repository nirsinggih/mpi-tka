<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz TKA Matematika SMP</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet">

    <style>

        body {
            background: linear-gradient(
                135deg,
                #eef5ff,
                #fff8e6
            );

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        .quiz-card {

            background: #ffffff;

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);

            margin-bottom: 25px;
        }


        .logo-box {

            width: 90px;
            height: 90px;

            margin: auto;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background: #f1f5f9;
        }


        .logo-box img {

            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        .answer-option {

            border: 2px solid #e5e7eb;

            border-radius: 12px;

            padding: 14px 16px;

            transition: 0.2s;

            cursor: pointer;
        }


        .answer-option:hover {

            border-color: #0d6efd;

            background: #f0f7ff;
        }


        .answer-option:has(
            input:checked
        ) {

            border-color: #0d6efd;

            background: #eaf3ff;
        }


        .answer-option label {

            cursor: pointer;
        }


        .question-box {

            background: #f8fafc;

            border-radius: 15px;

            padding: 22px;

            border-left: 5px solid #0d6efd;
        }


        .progress {

            height: 10px;

            border-radius: 20px;
        }


        .result-score {

            font-size: 70px;

            font-weight: bold;

            color: #0d6efd;
        }


        .hidden {

            display: none !important;
        }


        .statement-box {

            border: 1px solid #dee2e6;

            border-radius: 12px;

            padding: 15px;

            margin-bottom: 15px;

            background: #ffffff;
        }


        @media (max-width: 576px) {

            .quiz-card {

                padding: 20px;

                border-radius: 15px;
            }


            .result-score {

                font-size: 55px;
            }
        }

    </style>

</head>


<body>


<div class="container py-4">

    <!-- ================================================= -->
    <!-- HALAMAN IDENTITAS -->
    <!-- ================================================= -->

                <p class="text-muted">

                    Tes Kemampuan Akademik –

                </p>

            </div>


            <div class="alert alert-info">

                <i class="fa-solid fa-circle-info"></i>

            </div>


            <form id="formIdentitas">

                <!-- Nama -->

                <div class="mb-3">

                    <label

                        Nama Siswa

                    </label>

                        type="text"
                        id="nama"

                        required>

                </div>

                    <label
                        class="form-label fw-bold">

                        Asal Sekolah

                    </label>

                        type="text"
                        id="sekolah"

                        required>

                    <label
                        class="form-label fw-bold">

                        Kelas

                    </label>

                        type="text"
                        id="kelas"
                        class="form-control form-control-lg"

                        required>

                </div>

                    <label
                        class="form-label fw-bold">

                        Nomor Peserta

                    </label>

                </div>


                <button

                    Mulai Quiz

                </button>

            </form>

        </div>


        <div class="text-center text-muted small">

            Quiz TKA Matematika SMP

        </div>

    </div>


    <!-- ================================================= -->
    <!-- HALAMAN QUIZ -->
    <!-- ================================================= -->

    <div

    <!-- ================================================= -->

        <div

    </div>

</div>

/* =========================================================
   VARIABEL
   ========================================================= */

let daftarSoal = [];

let jawabanSiswa = [];

let nomorSoalSekarang = 0;

let dataSiswa = {};


/* =========================================================
   FUNGSI ACAK
   ========================================================= */

function acakArray(array) {

    const hasil = [...array];

    for (
        let i = hasil.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            hasil[i],
            hasil[j]
        ] =
        [
            hasil[j],
            hasil[i]
        ];
    }

    return hasil;
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";
    }

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   FORM IDENTITAS
   ========================================================= */

document
    .getElementById("formIdentitas")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            dataSiswa = {

                nama:
                    document
                    .getElementById("nama")
                    .value
                    .trim(),

                sekolah:
                    document
                    .getElementById("sekolah")
                    .value

                kelas:

                    .value

                    .getElementById("nomor")
                    .value

                );

                return;
            }


            if (!dataSiswa.sekolah) {

                );

                return;

                );

            mulaiQuiz();

/* =========================================================
   MULAI QUIZ
   ========================================================= */

function mulaiQuiz() {

    daftarSoal =
        DATA_QUIZ.soal.map(
            function(soal) {

                const salinan = {
                    ...soal
                };


                if (
                    Array.isArray(
                        soal.opsi
                    )
                ) {

                    salinan.opsi =
                        [
                            ...soal.opsi
                        ];
                }


                if (
                    Array.isArray(
                        soal.pernyataan
                    )
                ) {

                    salinan.pernyataan =
                        soal.pernyataan.map(
                            function(item) {

                                return {
                                    ...item
                                };
                            }
                        );
                }


                return salinan;
            }
        );


    /* Acak soal */

    if (
        DATA_QUIZ.acak_soal
    ) {

        daftarSoal =
            acakArray(
                daftarSoal
            );
    }


    /* Acak opsi */

    if (
        DATA_QUIZ.acak_opsi
    ) {

        daftarSoal.forEach(
            function(soal) {

                if (
                    soal.tipe ===
                    "pilihan_ganda" ||

                    soal.tipe ===
                    "pilihan_ganda_kompleks"
                ) {

                    soal.opsi =
                        acakArray(
                            soal.opsi
                        );
                }

            }
        );
    }


    /* Siapkan jawaban */

    jawabanSiswa =
        daftarSoal.map(
            function(soal) {

                if (
                    soal.tipe ===
                    "pilihan_ganda_kompleks"
                ) {

                    return [];
                }


                if (
                    soal.tipe ===
                    "benar_salah_kompleks"
                ) {

                    return [];
                }


                return null;
            }
        );


    /* Tampilkan nama */

    document
        .getElementById("namaTampil")
        .textContent =
        dataSiswa.nama;


    /* Pindah halaman */

    document
        .getElementById("halamanIdentitas")
        .classList
        .add("hidden");


    document
        .getElementById("halamanQuiz")
        .classList
        .remove("hidden");


    tampilkanSoal();
}


/* =========================================================
   TAMPILKAN SOAL
   ========================================================= */

function tampilkanSoal() {

    const soal =
        daftarSoal[
            nomorSoalSekarang
        ];


    if (!soal) {
        return;
    }


    /* Nomor */

    document
        .getElementById("nomorSoal")
        .textContent =
        "Soal " +
        (
            nomorSoalSekarang + 1
        ) +
        " / " +
        daftarSoal.length;


    /* Pertanyaan */

    document
        .getElementById("pertanyaan")
        .textContent =
        soal.pertanyaan;


    /* Progress */

    const persen =
        (
            (
                nomorSoalSekarang + 1
            ) /
            daftarSoal.length
        ) *
        100;


    document
        .getElementById("progressBar")
        .style.width =
        persen + "%";


    /* Petunjuk */

    let petunjuk = "";

    if (
        soal.tipe ===
        "pilihan_ganda"
    ) {

        petunjuk =
            "Pilih satu jawaban yang paling tepat.";

    }

    else if (
        soal.tipe ===
        "pilihan_ganda_kompleks"
    ) {

        petunjuk =
            "Pilih semua jawaban yang benar.";

    }

    else if (
        soal.tipe ===
        "benar_salah_kompleks"
    ) {

        petunjuk =
            "Tentukan Benar atau Salah untuk setiap pernyataan.";
    }


    document
        .getElementById("petunjuk")
        .textContent =
        petunjuk;


    /* Container */

    const container =
        document
        .getElementById(
            "containerJawaban"
        );


    container.innerHTML = "";


    /* =====================================================
       PILIHAN GANDA
       ===================================================== */

    if (
        soal.tipe ===
        "pilihan_ganda"
    ) {

        soal.opsi.forEach(
            function(
                opsi,
                index
            ) {

                const id =
                    "opsi_" +
                    nomorSoalSekarang +
                    "_" +
                    index;


                const checked =
                    jawabanSiswa[
                        nomorSoalSekarang
                    ] === opsi
                        ? "checked"
                        : "";


                container.insertAdjacentHTML(
                    "beforeend",

                    `
                    <div class="form-check answer-option mb-3">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="jawaban"
                            id="${id}"
                            value="${escapeHTML(opsi)}"
                            ${checked}
                        >

                        <label
                            class="form-check-label w-100"
                            for="${id}"
                        >

                            <strong>
                                ${String.fromCharCode(
                                    65 + index
                                )}.
                            </strong>

                            ${escapeHTML(opsi)}

                        </label>

                    </div>
                    `
                );
            }
        );


        container
            .querySelectorAll(
                'input[name="jawaban"]'
            )
            .forEach(
                function(input) {

                    input.addEventListener(
                        "change",
                        function() {

                            jawabanSiswa[
                                nomorSoalSekarang
                            ] =
                            this.value;

                        }
                    );
                }
            );
    }


    /* =====================================================
       PILIHAN GANDA KOMPLEKS
       ===================================================== */

    else if (
        soal.tipe ===
        "pilihan_ganda_kompleks"
    ) {

        const jawabanSebelumnya =
            Array.isArray(
                jawabanSiswa[
                    nomorSoalSekarang
                ]
            )
                ?
                jawabanSiswa[
                    nomorSoalSekarang
                ]
                :
                [];


        soal.opsi.forEach(
            function(
                opsi,
                index
            ) {

                const id =
                    "kompleks_" +
                    nomorSoalSekarang +
                    "_" +
                    index;


                const checked =
                    jawabanSebelumnya
                    .includes(opsi)
                        ? "checked"
                        : "";


                container.insertAdjacentHTML(
                    "beforeend",

                    `
                    <div class="form-check answer-option mb-3">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            name="jawabanKompleks"
                            id="${id}"
                            value="${escapeHTML(opsi)}"
                            ${checked}
                        >

                        <label
                            class="form-check-label w-100"
                            for="${id}"
                        >

                            <strong>
                                ${String.fromCharCode(
                                    65 + index
                                )}.
                            </strong>

                            ${escapeHTML(opsi)}

                        </label>

                    </div>
                    `
                );
            }
        );


        container
            .querySelectorAll(
                'input[name="jawabanKompleks"]'
            )
            .forEach(
                function(input) {

                    input.addEventListener(
                        "change",
                        function() {

                            jawabanSiswa[
                                nomorSoalSekarang
                            ] =
                            Array.from(
                                container.querySelectorAll(
                                    'input[name="jawabanKompleks"]:checked'
                                )
                            )
                            .map(
                                function(item) {

                                    return item.value;

                                }
                            );

                        }
                    );

                }
            );
    }


    /* =====================================================
       BENAR SALAH KOMPLEKS
       ===================================================== */

    else if (
        soal.tipe ===
        "benar_salah_kompleks"
    ) {

        const jawabanSebelumnya =
            Array.isArray(
                jawabanSiswa[
                    nomorSoalSekarang
                ]
            )
                ?
                jawabanSiswa[
                    nomorSoalSekarang
                ]
                :
                [];


        soal.pernyataan.forEach(
            function(
                item,
                index
            ) {

                const jawaban =
                    jawabanSebelumnya[
                        index
                    ] || "";


                container.insertAdjacentHTML(
                    "beforeend",

                    `
                    <div class="statement-box">

                        <div class="fw-semibold mb-3">

                            ${index + 1}.

                            ${escapeHTML(
                                item.teks
                            )}

                        </div>


                        <div class="d-flex gap-4">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="bs_${index}"
                                    id="benar_${index}"
                                    value="Benar"
                                    ${jawaban === "Benar"
                                        ? "checked"
                                        : ""}
                                >

                                <label
                                    class="form-check-label"
                                    for="benar_${index}"
                                >

                                    <i class="fa-solid fa-check text-success"></i>

                                    Benar

                                </label>

                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="bs_${index}"
                                    id="salah_${index}"
                                    value="Salah"
                                    ${jawaban === "Salah"
                                        ? "checked"
                                        : ""}
                                >

                                <label
                                    class="form-check-label"
                                    for="salah_${index}"
                                >

                                    <i class="fa-solid fa-xmark text-danger"></i>

                                    Salah

                                </label>

                            </div>

                        </div>

                    </div>
                    `
                );
            }
        );


        container
            .querySelectorAll(
                'input[type="radio"]'
            )
            .forEach(
                function(input) {

                    input.addEventListener(
                        "change",
                        function() {

                            const bagian =
                                this.name.split("_");

                            const index =
                                parseInt(
                                    bagian[1]
                                );


                            if (
                                !Array.isArray(
                                    jawabanSiswa[
                                        nomorSoalSekarang
                                    ]
                                )
                            ) {

                                jawabanSiswa[
                                    nomorSoalSekarang
                                ] = [];
                            }


                            jawabanSiswa[
                                nomorSoalSekarang
                            ][index] =
                            this.value;

                        }
                    );

                }
            );
    }


    updateNavigasi();
}


/* =========================================================
   NAVIGASI
   ========================================================= */

function updateNavigasi() {

    const sebelumnya =
        document.getElementById(
            "btnSebelumnya"
        );

    const berikutnya =
        document.getElementById(
            "btnBerikutnya"
        );

    const selesai =
        document.getElementById(
            "btnSelesai"
        );


    sebelumnya.disabled =
        nomorSoalSekarang === 0;


    if (
        nomorSoalSekarang ===
        daftarSoal.length - 1
    ) {

        berikutnya.classList
            .add("hidden");

        selesai.classList
            .remove("hidden");

    }

    else {

        berikutnya.classList
            .remove("hidden");

        selesai.classList
            .add("hidden");
    }
}


/* =========================================================
   SEBELUMNYA
   ========================================================= */

document
    .getElementById("btnSebelumnya")
    .addEventListener(
        "click",
        function() {

            if (
                nomorSoalSekarang > 0
            ) {

                nomorSoalSekarang--;

                tampilkanSoal();

                window.scrollTo(
                    0,
                    0
                );
            }
        }
    );


/* =========================================================
   BERIKUTNYA
   ========================================================= */

document
    .getElementById("btnBerikutnya")
    .addEventListener(
        "click",
        function() {

            if (
                nomorSoalSekarang <
                daftarSoal.length - 1
            ) {

                nomorSoalSekarang++;

                tampilkanSoal();

                window.scrollTo(
                    0,
                    0
                );
            }

    );


/* =========================================================

   ========================================================= */

document
    .getElementById("btnSelesai")
    .addEventListener(

        function() {

            const yakin =
                confirm(
                    "Apakah Bapak/Ibu yakin ingin menyelesaikan quiz?"
                );


            if (!yakin) {
                return;
            }


            hitungNilai();
        }
    );


/* =========================================================
   HITUNG NILAI
   ========================================================= */

function hitungNilai() {

    let totalSkor = 0;

    let totalMaksimal = 0;


    daftarSoal.forEach(
        function(
            soal,
            index
        ) {

            const jawaban =
                jawabanSiswa[index];


            /* PG */

            if (
                soal.tipe ===
                "pilihan_ganda"
            ) {

                totalMaksimal += 1;


                if (
                    jawaban ===
                    soal.jawaban
                ) {

                    totalSkor += 1;
                }
            }


            /* PG Kompleks */

            else if (
                soal.tipe ===
                "pilihan_ganda_kompleks"
            ) {

                totalMaksimal += 1;


                const benar =
                    [...soal.jawaban]
                    .sort();


                const dipilih =
                    Array.isArray(jawaban)
                        ?
                        [...jawaban].sort()
                        :
                        [];


                if (
                    JSON.stringify(
                        benar
                    ) ===
                    JSON.stringify(
                        dipilih
                    )
                ) {

                    totalSkor += 1;
                }
            }


            /* Benar Salah Kompleks */

            else if (
                soal.tipe ===
                "benar_salah_kompleks"
            ) {

                totalMaksimal +=
                    soal.pernyataan.length;


                soal.pernyataan.forEach(
                    function(
                        item,
                        indexPernyataan
                    ) {

                        if (
                            jawaban &&
                            jawaban[
                                indexPernyataan
                            ] ===
                            item.jawaban
                        ) {

                            totalSkor += 1;
                        }

                    }
                );
            }

        }
    );


    /* Nilai */

    const nilai =
        totalMaksimal > 0
            ?
            Math.round(
                (
                    totalSkor /
                    totalMaksimal
                ) *
                100
            )
            :
            0;


    /* Status */

    const tuntas =
        nilai >= DATA_QUIZ.kkm;


    /* Tampilkan */

    document
        .getElementById(
            "nilaiAkhir"
        )
        .textContent =
        nilai;


    document
        .getElementById(
            "hasilNama"
        )
        .textContent =
        dataSiswa.nama;


    document
        .getElementById(
            "hasilSekolah"
        )
        .textContent =
        dataSiswa.sekolah;


    document
        .getElementById(
            "hasilKelas"
        )
        .textContent =
        "Kelas " +
        dataSiswa.kelas;


    document
        .getElementById(
            "skorHasil"
        )
        .textContent =
        totalSkor;


    document
        .getElementById(
            "maksimalHasil"
        )
        .textContent =
        totalMaksimal;


    document
        .getElementById(
            "kkmHasil"
        )
        .textContent =
        DATA_QUIZ.kkm;


    const status =
        document
        .getElementById(
            "statusHasil"
        );


    status.textContent =
        tuntas
            ? "TUNTAS"
            : "BELUM TUNTAS";


    status.className =
        tuntas
            ?
            "badge bg-success fs-5 p-2 mb-4"
            :
            "badge bg-danger fs-5 p-2 mb-4";


    /* Pindah halaman */

    document
        .getElementById(
            "halamanQuiz"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "halamanHasil"
        )
        .classList
        .remove("hidden");


    window.scrollTo(
        0,
        0
    );
}
