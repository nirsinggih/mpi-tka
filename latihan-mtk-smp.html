/* =========================================================

   ========================================================= */

let daftarSoal = [];

let jawabanSiswa = [];

let nomorSoalSekarang = 0;

let dataSiswa = {};


/* =========================================================
   FUNGSI ACAK
   ========================================================= */

function acakArray(array) {

    const hasil = [...array];

    for (
        let i = hasil.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            hasil[i],
            hasil[j]
        ] =
        [
            hasil[j],
            hasil[i]
        ];
    }

    return hasil;
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";
    }

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   FORM IDENTITAS
   ========================================================= */

document

    .addEventListener(

/* =========================================================
   MULAI QUIZ
   ========================================================= */

function mulaiQuiz() {

    daftarSoal =
        DATA_QUIZ.soal.map(
            function(soal) {

                const salinan = {
                    ...soal
                };


                if (
                    Array.isArray(
                        soal.opsi
                    )
                ) {

                    salinan.opsi =
                        [
                            ...soal.opsi
                        ];
                }


                if (
                    Array.isArray(
                        soal.pernyataan
                    )
                ) {

                    salinan.pernyataan =
                        soal.pernyataan.map(
                            function(item) {

                                return {
                                    ...item
                                };
                            }
                        );
                }


                return salinan;
            }
        );


    /* Acak soal */

    if (
        DATA_QUIZ.acak_soal
    ) {

        daftarSoal =
            acakArray(
                daftarSoal
            );
    }


    /* Acak opsi */

    if (
        DATA_QUIZ.acak_opsi
    ) {

        daftarSoal.forEach(
            function(soal) {

                if (
                    soal.tipe ===
                    "pilihan_ganda" ||

                    soal.tipe ===
                    "pilihan_ganda_kompleks"
                ) {

                    soal.opsi =
                        acakArray(
                            soal.opsi
                        );
                }

            }
        );
    }


    /* Siapkan jawaban */

    jawabanSiswa =
        daftarSoal.map(
            function(soal) {

                if (
                    soal.tipe ===
                    "pilihan_ganda_kompleks"
                ) {

                    return [];
                }


                if (
                    soal.tipe ===
                    "benar_salah_kompleks"
                ) {

                    return [];
                }


                return null;
            }
        );


    /* Tampilkan nama */

    document
        .getElementById("namaTampil")
        .textContent =
        dataSiswa.nama;


    /* Pindah halaman */

    document
        .getElementById("halamanIdentitas")
        .classList
        .add("hidden");


    document
        .getElementById("halamanQuiz")
        .classList
        .remove("hidden");


    tampilkanSoal();
}


/* =========================================================
   TAMPILKAN SOAL
   ========================================================= */

function tampilkanSoal() {

    const soal =
        daftarSoal[
            nomorSoalSekarang
        ];


    if (!soal) {
        return;
    }


    /* Nomor */

    document
        .getElementById("nomorSoal")
        .textContent =
        "Soal " +
        (
            nomorSoalSekarang + 1
        ) +
        " / " +
        daftarSoal.length;


    /* Pertanyaan */

    document
        .getElementById("pertanyaan")
        .textContent =
        soal.pertanyaan;


    /* Progress */

    const persen =
        (
            (
                nomorSoalSekarang + 1
            ) /
            daftarSoal.length
        ) *
        100;


    document
        .getElementById("progressBar")
        .style.width =
        persen + "%";


    /* Petunjuk */

    let petunjuk = "";

    if (
        soal.tipe ===
        "pilihan_ganda"
    ) {

        petunjuk =
            "Pilih satu jawaban yang paling tepat.";

    }

    else if (
        soal.tipe ===
        "pilihan_ganda_kompleks"
    ) {

        petunjuk =
            "Pilih semua jawaban yang benar.";

    }

    else if (
        soal.tipe ===
        "benar_salah_kompleks"
    ) {

        petunjuk =
            "Tentukan Benar atau Salah untuk setiap pernyataan.";
    }


    document
        .getElementById("petunjuk")
        .textContent =
        petunjuk;


    /* Container */

    const container =
        document
        .getElementById(
            "containerJawaban"
        );


    container.innerHTML = "";


    /* =====================================================
       PILIHAN GANDA
       ===================================================== */

    if (
        soal.tipe ===
        "pilihan_ganda"
    ) {

        soal.opsi.forEach(
            function(
                opsi,
                index
            ) {

                const id =
                    "opsi_" +
                    nomorSoalSekarang +
                    "_" +
                    index;


                const checked =
                    jawabanSiswa[
                        nomorSoalSekarang
                    ] === opsi
                        ? "checked"
                        : "";


                container.insertAdjacentHTML(
                    "beforeend",

                    `
                    <div class="form-check answer-option mb-3">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="jawaban"
                            id="${id}"
                            value="${escapeHTML(opsi)}"
                            ${checked}
                        >

                        <label
                            class="form-check-label w-100"
                            for="${id}"
                        >

                            <strong>
                                ${String.fromCharCode(
                                    65 + index
                                )}.
                            </strong>

                            ${escapeHTML(opsi)}

                        </label>

                    </div>
                    `
                );
            }
        );


        container
            .querySelectorAll(
                'input[name="jawaban"]'
            )
            .forEach(
                function(input) {

                    input.addEventListener(
                        "change",
                        function() {

                            jawabanSiswa[
                                nomorSoalSekarang
                            ] =
                            this.value;

                        }
                    );
                }
            );
    }


    /* =====================================================
       PILIHAN GANDA KOMPLEKS
       ===================================================== */

    else if (
        soal.tipe ===
        "pilihan_ganda_kompleks"
    ) {

        const jawabanSebelumnya =
            Array.isArray(
                jawabanSiswa[
                    nomorSoalSekarang
                ]
            )
                ?
                jawabanSiswa[
                    nomorSoalSekarang
                ]
                :
                [];


        soal.opsi.forEach(
            function(
                opsi,
                index
            ) {

                const id =
                    "kompleks_" +
                    nomorSoalSekarang +
                    "_" +
                    index;


                const checked =
                    jawabanSebelumnya
                    .includes(opsi)
                        ? "checked"
                        : "";


                container.insertAdjacentHTML(
                    "beforeend",

                    `
                    <div class="form-check answer-option mb-3">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            name="jawabanKompleks"
                            id="${id}"
                            value="${escapeHTML(opsi)}"
                            ${checked}
                        >

                        <label
                            class="form-check-label w-100"
                            for="${id}"
                        >

                            <strong>
                                ${String.fromCharCode(
                                    65 + index
                                )}.
                            </strong>

                            ${escapeHTML(opsi)}

                        </label>

                    </div>
                    `
                );
            }
        );


        container
            .querySelectorAll(
                'input[name="jawabanKompleks"]'
            )
            .forEach(
                function(input) {

                    input.addEventListener(
                        "change",
                        function() {

                            jawabanSiswa[
                                nomorSoalSekarang
                            ] =
                            Array.from(
                                container.querySelectorAll(
                                    'input[name="jawabanKompleks"]:checked'
                                )
                            )
                            .map(
                                function(item) {

                                    return item.value;

                                }
                            );

                        }
                    );

                }
            );
    }


    /* =====================================================
       BENAR SALAH KOMPLEKS
       ===================================================== */

    else if (
        soal.tipe ===
        "benar_salah_kompleks"
    ) {

        const jawabanSebelumnya =
            Array.isArray(
                jawabanSiswa[
                    nomorSoalSekarang
                ]
            )
                ?
                jawabanSiswa[
                    nomorSoalSekarang
                ]
                :
                [];


        soal.pernyataan.forEach(
            function(
                item,
                index
            ) {

                const jawaban =
                    jawabanSebelumnya[
                        index
                    ] || "";


                container.insertAdjacentHTML(
                    "beforeend",

                    `
                    <div class="statement-box">

                        <div class="fw-semibold mb-3">

                            ${index + 1}.

                            ${escapeHTML(
                                item.teks
                            )}

                        </div>


                        <div class="d-flex gap-4">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="bs_${index}"
                                    id="benar_${index}"
                                    value="Benar"
                                    ${jawaban === "Benar"
                                        ? "checked"
                                        : ""}
                                >

                                <label
                                    class="form-check-label"
                                    for="benar_${index}"
                                >

                                    <i class="fa-solid fa-check text-success"></i>

                                    Benar

                                </label>

                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="bs_${index}"
                                    id="salah_${index}"
                                    value="Salah"
                                    ${jawaban === "Salah"
                                        ? "checked"
                                        : ""}
                                >

                                <label
                                    class="form-check-label"
                                    for="salah_${index}"
                                >

                                    <i class="fa-solid fa-xmark text-danger"></i>

                                    Salah

                                </label>

                            </div>

                        </div>

                    </div>
                    `
                );
            }
        );


        container
            .querySelectorAll(
                'input[type="radio"]'
            )
            .forEach(
                function(input) {

                    input.addEventListener(
                        "change",
                        function() {

                            const bagian =
                                this.name.split("_");

                            const index =
                                parseInt(
                                    bagian[1]
                                );


                            if (
                                !Array.isArray(
                                    jawabanSiswa[
                                        nomorSoalSekarang
                                    ]
                                )
                            ) {

                                jawabanSiswa[
                                    nomorSoalSekarang
                                ] = [];
                            }


                            jawabanSiswa[
                                nomorSoalSekarang
                            ][index] =
                            this.value;

                        }
                    );

                }
            );
    }


    updateNavigasi();
}


/* =========================================================
   NAVIGASI
   ========================================================= */

function updateNavigasi() {

    const sebelumnya =
        document.getElementById(
            "btnSebelumnya"
        );

    const berikutnya =
        document.getElementById(
            "btnBerikutnya"
        );

    const selesai =
        document.getElementById(
            "btnSelesai"
        );


    sebelumnya.disabled =
        nomorSoalSekarang === 0;


    if (
        nomorSoalSekarang ===
        daftarSoal.length - 1
    ) {

        berikutnya.classList
            .add("hidden");

        selesai.classList
            .remove("hidden");

    }

    else {

        berikutnya.classList
            .remove("hidden");

        selesai.classList
            .add("hidden");
    }
}


/* =========================================================
   SEBELUMNYA
   ========================================================= */

document
    .getElementById("btnSebelumnya")
    .addEventListener(
        "click",
        function() {

            if (
                nomorSoalSekarang > 0
            ) {

                nomorSoalSekarang--;

                tampilkanSoal();

                window.scrollTo(
                    0,
                    0
                );
            }
        }
    );


/* =========================================================
   BERIKUTNYA
   ========================================================= */

document
    .getElementById("btnBerikutnya")
    .addEventListener(
        "click",
        function() {

            if (
                nomorSoalSekarang <
                daftarSoal.length - 1
            ) {

                nomorSoalSekarang++;

                tampilkanSoal();

                window.scrollTo(
                    0,
                    0
                );
            }
        }
    );


/* =========================================================
   SELESAI
   ========================================================= */

document
    .getElementById("btnSelesai")
    .addEventListener(
        "click",
        function() {

            const yakin =
                confirm(
                    "Apakah Bapak/Ibu yakin ingin menyelesaikan quiz?"
                );


            if (!yakin) {
                return;
            }


            hitungNilai();
        }
    );


/* =========================================================
   HITUNG NILAI
   ========================================================= */

function hitungNilai() {

    let totalSkor = 0;

    let totalMaksimal = 0;


    daftarSoal.forEach(
        function(
            soal,
            index
        ) {

            const jawaban =
                jawabanSiswa[index];


            /* PG */

            if (
                soal.tipe ===
                "pilihan_ganda"
            ) {

                totalMaksimal += 1;


                if (
                    jawaban ===
                    soal.jawaban
                ) {

                    totalSkor += 1;
                }
            }


            /* PG Kompleks */

            else if (
                soal.tipe ===
                "pilihan_ganda_kompleks"
            ) {

                totalMaksimal += 1;


                const benar =
                    [...soal.jawaban]
                    .sort();


                const dipilih =
                    Array.isArray(jawaban)
                        ?
                        [...jawaban].sort()
                        :
                        [];


                if (
                    JSON.stringify(
                        benar
                    ) ===
                    JSON.stringify(
                        dipilih
                    )
                ) {

                    totalSkor += 1;
                }
            }


            /* Benar Salah Kompleks */

            else if (
                soal.tipe ===
                "benar_salah_kompleks"
            ) {

                totalMaksimal +=
                    soal.pernyataan.length;


                soal.pernyataan.forEach(
                    function(
                        item,
                        indexPernyataan
                    ) {

                        if (
                            jawaban &&
                            jawaban[
                                indexPernyataan
                            ] ===
                            item.jawaban
                        ) {

                            totalSkor += 1;
                        }

                    }
                );
            }

        }
    );


    /* Nilai */

    const nilai =
        totalMaksimal > 0
            ?
            Math.round(
                (
                    totalSkor /
                    totalMaksimal
                ) *
                100
            )
            :
            0;


    /* Status */

    const tuntas =
        nilai >= DATA_QUIZ.kkm;


    /* Tampilkan */

    document
        .getElementById(
            "nilaiAkhir"
        )
        .textContent =
        nilai;


    document
        .getElementById(
            "hasilNama"
        )
        .textContent =
        dataSiswa.nama;


    document
        .getElementById(
            "hasilSekolah"
        )
        .textContent =
        dataSiswa.sekolah;


    document
        .getElementById(
            "hasilKelas"
        )
        .textContent =
        "Kelas " +
        dataSiswa.kelas;


    document
        .getElementById(
            "skorHasil"
        )
        .textContent =
        totalSkor;


    document
        .getElementById(
            "maksimalHasil"
        )
        .textContent =
        totalMaksimal;


    document
        .getElementById(
            "kkmHasil"
        )
        .textContent =
        DATA_QUIZ.kkm;


    const status =
        document
        .getElementById(
            "statusHasil"
        );


    status.textContent =
        tuntas
            ? "TUNTAS"
            : "BELUM TUNTAS";


    status.className =
        tuntas
            ?
            "badge bg-success fs-5 p-2 mb-4"
            :
            "badge bg-danger fs-5 p-2 mb-4";


    /* Pindah halaman */

    document
        .getElementById(
            "halamanQuiz"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "halamanHasil"
        )
        .classList
        .remove("hidden");


    window.scrollTo(
        0,
        0
    );
}


/* =========================================================
   ULANGI QUIZ
   ========================================================= */

document
    .getElementById("btnUlangi")
    .addEventListener(
        "click",
        function() {

            nomorSoalSekarang = 0;

            jawabanSiswa = [];

            document
                .getElementById(
                    "halamanHasil"
                )
                .classList
                .add("hidden");


            document
                .getElementById(
                    "halamanIdentitas"
                )
                .classList
                .remove("hidden");


            document
                .getElementById("nama")
                .value = dataSiswa.nama;


            document
                .getElementById("sekolah")
                .value =
                dataSiswa.sekolah;


            document
                .getElementById("kelas")
                .value =
                dataSiswa.kelas;


            document
                .getElementById("nomor")
                .value =
                dataSiswa.nomor;

        }
    );


/* =========================================================
   TOMBOL KEMBALI
   ========================================================= */

document
    .getElementById("btnBeranda")
    .addEventListener(
        "click",
        function() {

            location.reload();

        }
    );

</script>
