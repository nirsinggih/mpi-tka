<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pembelajaran Interaktif Mobile</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & MOBILE BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 60%, #311042 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Mengalir dari atas untuk HP */
            padding: 20px 15px 40px 15px;
            overflow-x: hidden;
        }

        /* --- BACKGROUND BLOBS (DIKECILKAN UNTUK PERFORMANSE HP) --- */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            z-index: 1;
            animation: float 8s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 250px;
            height: 250px;
            background: #3b82f6;
            top: -40px;
            left: -40px;
        }

        .blob-2 {
            width: 280px;
            height: 280px;
            background: #8b5cf6;
            bottom: -40px;
            right: -40px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 20px) scale(1.08); }
        }

        /* --- MAIN CONTAINER --- */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px; /* Ukuran ideal layar HP */
            padding: 24px 18px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- HEADER HP --- */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 0.88rem;
            color: #cbd5e1;
            font-weight: 400;
            line-height: 1.3;
        }

        /* --- STACK SECTION --- */
        .jenjang-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- CARD HP STYLES --- */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 18px 15px;
            transition: transform 0.2s ease;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .badge {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
        }

        .sd-badge {
            background: linear-gradient(135deg, #ef4444, #f97316);
            box-shadow: 0 6px 15px rgba(239, 68, 68, 0.3);
        }

        .smp-badge {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* --- BUTTON MATERI (MOBILE TOUCH-FRIENDLY) --- */
        .materi-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-materi {
            width: 100%;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        /* Feedback Sentuhan Jari di HP */
        .btn-materi:active {
            transform: scale(0.96); /* Efek membal saat ditap */
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-color: #a78bfa;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-materi .materi-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-materi .num {
            background: rgba(255, 255, 255, 0.15);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .btn-materi .icon {
            font-size: 1.1rem;
            opacity: 0.7;
            transition: transform 0.2s ease;
        }

        .btn-materi:active .icon {
            transform: translateX(4px);
            opacity: 1;
        }

        /* Footer Keterangan Singkat */
        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Main Container -->
    <div class="container">
        <header>
            <h1>Portal Belajar</h1>
            <p>Pilih jenjang dan materi untuk memulai</p>
        </header>

        <div class="jenjang-stack">
            
            <!-- SEKSI A: SEKOLAH DASAR (SD) -->
            <div class="card">
                <div class="card-header">
                    <div class="badge sd-badge">SD</div>
                    <div class="card-title">Sekolah Dasar</div>
                </div>
                <div class="materi-list">
                    <button class="btn-materi" onclick="bukaMateri('SD', 'Matematika')">
                        <div class="materi-info">
                            <span class="num">1</span>
                            <span>Matematika</span>
                        </div>
                        <span class="icon">➔</span>
                    </button>
                    <button class="btn-materi" onclick="bukaMateri('SD', 'Bahasa Indonesia')">
                        <div class="materi-info">
                            <span class="num">2</span>
                            <span>Bahasa Indonesia</span>
                        </div>
                        <span class="icon">➔</span>
                    </button>
                </div>
            </div>

            <!-- SEKSI B: SEKOLAH MENENGAH PERTAMA (SMP) -->
            <div class="card">
                <div class="card-header">
                    <div class="badge smp-badge">SMP</div>
                    <div class="card-title">Sekolah Menengah Pertama</div>
                </div>
                <div class="materi-list">
                    <button class="btn-materi" onclick="bukaMateri('SMP', 'Matematika')">
                        <div class="materi-info">
                            <span class="num">1</span>
                            <span>Matematika</span>
                        </div>
                        <span class="icon">➔</span>
                    </button>
                    <button class="btn-materi" onclick="bukaMateri('SMP', 'Bahasa Indonesia')">
                        <div class="materi-info">
                            <span class="num">2</span>
                            <span>Bahasa Indonesia</span>
                        </div>
                        <span class="icon">➔</span>
                    </button>
                </div>
            </div>

        </div>

        <footer>
            &copy; Media Pembelajaran Mobile
        </footer>
    </div>

    <!-- JavaScript Interaktif -->
    <script>
    function bukaMateri(jenjang, materi) {
        // Efek getar ringan di HP (jika mendukung)
        if (navigator.vibrate) {
            navigator.vibrate(40);
        }

        // --- ATUR LINK TUJUAN DI SINI ---
        if (jenjang === 'SD' && materi === 'Matematika') {
            window.location.href = "https://nirsinggih.github.io/mpi-tka/hp/mtk.html";
        } 
        else if (jenjang === 'SD' && materi === 'Bahasa Indonesia') {
            window.location.href = "https://nirsinggih.github.io/mpi-tka/hp/b-ind.html";
        } 
        else if (jenjang === 'SMP' && materi === 'Matematika') {
            window.location.href = "https://nirsinggih.github.io/mpi-tka/hp/mtk.html";
        } 
        else if (jenjang === 'SMP' && materi === 'Bahasa Indonesia') {
            window.location.href = "https://nirsinggih.github.io/mpi-tka/hp/mtk.html";
        }
    }
</script>
</body>
</html>
