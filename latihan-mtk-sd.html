            "pertanyaan": "Perhatikan pernyataan berikut tentang pengukuran dan data. Tentukan Benar atau Salah.",
            "pernyataan": [
                {
                    "teks": "1 kilogram = 1.000 gram.",
                    "jawaban": "Benar"
                },
                {
                    "teks": "1 liter = 100 mililiter.",
                    "jawaban": "Salah"
                },
                {
                    "teks": "Rata-rata diperoleh dengan menjumlahkan semua data lalu membaginya dengan banyak data.",
                    "jawaban": "Benar"
                },
                {
                    "teks": "Jangkauan adalah nilai terbesar dikurangi nilai terkecil.",
                    "jawaban": "Benar"
                }
            ]
        }
    ]
};

/* ==========================================================
   VARIABEL
========================================================== */

let daftarSoal = [];

let jawabanSiswa = [];

let nomorSoalSekarang = 0;

let dataSiswa = {};


/* ==========================================================
   FUNGSI ACAK
========================================================== */

function acakArray(array) {

    let hasil = [...array];

    for (
        let i = hasil.length - 1;
        i > 0;
        i--
    ) {

        let j = Math.floor(
            Math.random() * (i + 1)
        );

        [
            hasil[i],
            hasil[j]
        ] = [
            hasil[j],
            hasil[i]
        ];
    }

    return hasil;
}


/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==========================================================
   MULAI QUIZ
========================================================== */

document
.getElementById("formIdentitas")
.addEventListener("submit", function(e) {

    e.preventDefault();

    dataSiswa = {

        nama: document
            .getElementById("nama")
            .value
            .trim(),

        sekolah: document
            .getElementById("sekolah")
            .value
            .trim(),

        kelas: document
            .getElementById("kelas")
            .value,

        nomor: document
            .getElementById("nomor")
            .value
            .trim()

    };


    daftarSoal = DATA_QUIZ.soal.map(soal => {

        let salinan = {
            ...soal
        };

        if (
            soal.tipe === "pilihan_ganda" ||
            soal.tipe === "pilihan_ganda_kompleks"
        ) {

            salinan.opsi = [
                ...soal.opsi
            ];

            if (DATA_QUIZ.acak_opsi) {

                salinan.opsi =
                    acakArray(salinan.opsi);

            }

        }

        return salinan;

    });


    if (DATA_QUIZ.acak_soal) {

        daftarSoal =
            acakArray(daftarSoal);

    }


    jawabanSiswa =
        new Array(daftarSoal.length)
        .fill(null);


    nomorSoalSekarang = 0;


    document
        .getElementById("halamanIdentitas")
        .style.display = "none";

    document
        .getElementById("halamanQuiz")
        .style.display = "block";

    document
        .getElementById("namaTampil")
        .textContent = dataSiswa.nama;


    tampilkanSoal();

});


/* ==========================================================
   TAMPILKAN SOAL
========================================================== */

function tampilkanSoal() {

    const soal =
        daftarSoal[nomorSoalSekarang];


    const total =
        daftarSoal.length;


    document
        .getElementById("nomorSoal")
        .textContent =
        `${nomorSoalSekarang + 1} / ${total}`;


    const persen =
        ((nomorSoalSekarang + 1) / total) * 100;


    document
        .getElementById("progressBar")
        .style.width =
        persen + "%";


    document
        .getElementById("pertanyaan")
        .innerHTML =
        soal.pertanyaan;


    const petunjuk =
        document.getElementById("petunjuk");


    const container =
        document.getElementById("containerJawaban");


    container.innerHTML = "";


    /* ======================================================
       PILIHAN GANDA
    ====================================================== */

    if (soal.tipe === "pilihan_ganda") {

        petunjuk.innerHTML =
            "<i class='fa-solid fa-circle-check'></i> " +
            "Pilih satu jawaban yang paling tepat.";

        soal.opsi.forEach((opsi, index) => {

            const label =
                document.createElement("label");

            label.className = "opsi d-block";


            const input =
                document.createElement("input");

            input.type = "radio";

            input.name = "jawaban";

            input.value = opsi;


            if (
                jawabanSiswa[nomorSoalSekarang]
                === opsi
            ) {

                input.checked = true;

            }


            input.addEventListener(
                "change",
                function() {

                    jawabanSiswa[
                        nomorSoalSekarang
                    ] = this.value;

                }
            );


            label.appendChild(input);

            label.appendChild(
                document.createTextNode(
                    " " + opsi
                )
            );


            container.appendChild(label);

        });

    }


    /* ======================================================
       PILIHAN GANDA KOMPLEKS
    ====================================================== */

    else if (
        soal.tipe === "pilihan_ganda_kompleks"
    ) {

        petunjuk.innerHTML =
            "<i class='fa-solid fa-list-check'></i> " +
            "Pilih semua jawaban yang benar.";

        soal.opsi.forEach(opsi => {

            const label =
                document.createElement("label");

            label.className =
                "opsi d-block";


            const input =
                document.createElement("input");

            input.type = "checkbox";

            input.value = opsi;


            const jawabanSebelumnya =
                jawabanSiswa[
                    nomorSoalSekarang
                ] || [];


            if (
                jawabanSebelumnya.includes(opsi)
            ) {

                input.checked = true;

            }


            input.addEventListener(
                "change",
                function() {

                    const semua =
                        container
                        .querySelectorAll(
                            "input[type='checkbox']"
                        );


                    let terpilih = [];

                    semua.forEach(item => {

                        if (item.checked) {

                            terpilih.push(
                                item.value
                            );

                        }

                    });


                    jawabanSiswa[
                        nomorSoalSekarang
                    ] = terpilih;

                }
            );


            label.appendChild(input);

            label.appendChild(
                document.createTextNode(
                    " " + opsi
                )
            );


            container.appendChild(label);

        });

    }


    /* ======================================================
       BENAR SALAH KOMPLEKS
    ====================================================== */

    else if (
        soal.tipe === "benar_salah_kompleks"
    ) {

        petunjuk.innerHTML =
            "<i class='fa-solid fa-circle-check'></i> " +
            "Tentukan Benar atau Salah pada setiap pernyataan.";

        const jawabanSebelumnya =
            jawabanSiswa[
                nomorSoalSekarang
            ] || [];


        soal.pernyataan.forEach(
            (pernyataan, index) => {

                const div =
                    document.createElement("div");

                div.className =
                    "border rounded p-3 mb-3";


                const teks =
                    document.createElement("div");

                teks.className =
                    "fw-semibold mb-2";

                teks.innerHTML =
                    `${index + 1}. ${escapeHTML(
                        pernyataan.teks
                    )}`;


                div.appendChild(teks);


                ["Benar", "Salah"]
                .forEach(pilihan => {

                    const label =
                        document.createElement("label");

                    label.className =
                        "me-4";


                    const input =
                        document.createElement("input");

                    input.type = "radio";

                    input.name =
                        "bs_" + index;

                    input.value =
                        pilihan;


                    if (
                        jawabanSebelumnya[index]
                        === pilihan
                    ) {

                        input.checked = true;

                    }


                    input.addEventListener(
                        "change",
                        function() {

                            if (
                                !Array.isArray(
                                    jawabanSiswa[
                                        nomorSoalSekarang
                                    ]
                                )
                            ) {

                                jawabanSiswa[
                                    nomorSoalSekarang
                                ] = [];

                            }


                            jawabanSiswa[
                                nomorSoalSekarang
                            ][index] =
                                this.value;

                        }
                    );


                    label.appendChild(input);

                    label.appendChild(
                        document.createTextNode(
                            " " + pilihan
                        )
                    );


                    div.appendChild(label);

                });


                container.appendChild(div);

            }
        );

    }


    updateNavigasi();

}


/* ==========================================================
   NAVIGASI
========================================================== */

function updateNavigasi() {

    const terakhir =
        nomorSoalSekarang ===
        daftarSoal.length - 1;


    document
        .getElementById("btnSebelumnya")
        .disabled =
        nomorSoalSekarang === 0;


    document
        .getElementById("btnBerikutnya")
        .style.display =
        terakhir ? "none" : "inline-block";


    document
        .getElementById("btnSelesai")
        .style.display =
        terakhir ? "inline-block" : "none";

}


/* ==========================================================
   TOMBOL SEBELUMNYA
========================================================== */

document
.getElementById("btnSebelumnya")
.addEventListener("click", function() {

    if (nomorSoalSekarang > 0) {

        nomorSoalSekarang--;

        tampilkanSoal();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

});


/* ==========================================================
   TOMBOL BERIKUTNYA
========================================================== */

document
.getElementById("btnBerikutnya")
.addEventListener("click", function() {

    if (
        nomorSoalSekarang <
        daftarSoal.length - 1
    ) {

        nomorSoalSekarang++;

        tampilkanSoal();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

});


/* ==========================================================
   TOMBOL SELESAI
========================================================== */

document
.getElementById("btnSelesai")
.addEventListener("click", function() {

    const yakin =
        confirm(
            "Apakah Bapak/Ibu yakin ingin menyelesaikan quiz?"
        );


    if (!yakin) {

        return;

    }


    hitungNilai();

});


/* ==========================================================
   HITUNG NILAI
========================================================== */

function hitungNilai() {

    let skor = 0;

    let maksimal = 0;


    daftarSoal.forEach(
        (soal, index) => {

            /* =========================
               PILIHAN GANDA
            ========================== */

            if (
                soal.tipe === "pilihan_ganda"
            ) {

                maksimal += 1;


                if (
                    jawabanSiswa[index]
                    === soal.jawaban
                ) {

                    skor += 1;

                }

            }


            /* =========================
               PILIHAN GANDA KOMPLEKS
            ========================== */

            else if (
                soal.tipe ===
                "pilihan_ganda_kompleks"
            ) {

                maksimal += 1;


                const jawaban =
                    jawabanSiswa[index] || [];


                const benar =
                    soal.jawaban;


                const samaPanjang =
                    jawaban.length ===
                    benar.length;


                const semuaBenar =
                    benar.every(
                        item =>
                            jawaban.includes(item)
                    );


                if (
                    samaPanjang &&
                    semuaBenar
                ) {

                    skor += 1;

                }

            }


            /* =========================
               BENAR SALAH KOMPLEKS
            ========================== */

            else if (
                soal.tipe ===
                "benar_salah_kompleks"
            ) {

                maksimal +=
                    soal.pernyataan.length;


                const jawaban =
                    jawabanSiswa[index] || [];


                soal.pernyataan.forEach(
                    (pernyataan, i) => {

                        if (
                            jawaban[i] ===
                            pernyataan.jawaban
                        ) {

                            skor += 1;

                        }

                    }
                );

            }

        }
    );


    const nilai =
        Math.round(
            (skor / maksimal) * 100
        );


    document
        .getElementById("halamanQuiz")
        .style.display = "none";


    document
        .getElementById("halamanHasil")
        .style.display = "block";


    document
        .getElementById("hasilNama")
        .textContent =
        dataSiswa.nama;


    document
        .getElementById("hasilSekolah")
        .textContent =
        dataSiswa.sekolah;


    document
        .getElementById("hasilKelas")
        .textContent =
        dataSiswa.kelas;


    document
        .getElementById("nilaiAkhir")
        .textContent =
        nilai;


    document
        .getElementById("skorHasil")
        .textContent =
        skor;


    document
        .getElementById("maksimalHasil")
        .textContent =
        maksimal;


    document
        .getElementById("kkmHasil")
        .textContent =
        DATA_QUIZ.kkm;


    const status =
        document.getElementById(
            "statusHasil"
        );


    if (nilai >= DATA_QUIZ.kkm) {

        status.innerHTML =
            "<div class='status-tuntas'>" +
            "<i class='fa-solid fa-circle-check'></i> " +
            "TUNTAS" +
            "</div>";

    } else {

        status.innerHTML =
            "<div class='status-belum'>" +
            "<i class='fa-solid fa-circle-xmark'></i> " +
            "BELUM TUNTAS" +
            "</div>";

    }


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==========================================================
   ULANGI QUIZ
========================================================== */

document
.getElementById("btnUlangi")
.addEventListener("click", function() {

    document
        .getElementById("halamanHasil")
        .style.display = "none";


    document
        .getElementById("halamanIdentitas")
        .style.display = "block";


    document
        .getElementById("nama")
        .value =
        dataSiswa.nama;


    document
        .getElementById("sekolah")
        .value =
        dataSiswa.sekolah;


    document
        .getElementById("kelas")
        .value =
        dataSiswa.kelas;


    document
        .getElementById("nomor")
        .value =
        dataSiswa.nomor;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

});


/* ==========================================================
   BERANDA / MULAI DARI AWAL
========================================================== */

document
.getElementById("btnBeranda")
.addEventListener("click", function() {

    location.reload();

});

</script>
