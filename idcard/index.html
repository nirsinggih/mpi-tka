<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cetak ID Card ANBK</title>

  <!-- Meta Description -->
  <meta name="description" content="Cetak ID Card ANBK secara online dengan mudah. Upload logo sekolah, foto, isi nama, jabatan, lalu unduh ID Card dalam format PDF siap cetak ukuran B3.">

  <!-- Open Graph (Facebook) -->
  <meta property="og:title" content="Cetak ID Card ANBK">
  <meta property="og:description" content="Buat dan cetak ID Card ANBK online dengan cepat. Dukungan logo sekolah, foto, jabatan, serta unduhan otomatis dalam PDF ukuran B3.">
  <meta property="og:image" content="https://idcard.snp.my.id/anbk1/preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://idcard.snp.my.id/anbk1/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Cetak ID Card ANBK">
  <meta name="twitter:description" content="Cetak ID Card ANBK online, praktis dan cepat. Unduh PDF siap cetak ukuran B3.">
  <meta name="twitter:image" content="https://idcard.snp.my.id/anbk1/preview.jpg">

  <!-- jsPDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --primary: #007BFF;
      --primary-dark: #0056b3;
      --bg-light: #f8f9fa;
      --text-dark: #343a40;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
      margin: auto;
    }

    h2 {
      text-align: center;
      color: var(--primary-dark);
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }

    input[type="text"],
    select,
    input[type="file"] {
      width: 100%;
      padding: 0.6rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.75rem;
      background-color: var(--primary);
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover { background-color: var(--primary-dark); }
    button:disabled { background-color: #999; cursor: not-allowed; }

    #previewWrap {
      display: none;
      margin-top: 1.5rem;
      text-align: center;
    }
    #previewWrap.show { display: block; }
    #previewCanvas {
      max-width: 100%;
      border: 1px dashed #bbb;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      margin: 1.5rem 0;
      color: #666;
    }

    footer a {
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      h2 { font-size: 1.3rem; }
    }

    #status {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--primary-dark);
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Cetak ID Card ANBK</h2>
    <form id="idcardForm">
      <label for="nama">Nama Lengkap dan Gelar</label>
      <input type="text" name="nama" id="nama" required>

      <label for="sekolah">Nama Sekolah</label>
      <input type="text" name="sekolah" id="sekolah" required>

      <label for="logo">Upload Logo Sekolah/Kab/Kota (PNG/JPG)</label>
      <input type="file" name="logo" id="logo" accept="image/*" required>

      <label for="jabatan">Jabatan</label>
      <select name="jabatan" id="jabatan" required>
        <option value="">-- Pilih Jabatan --</option>
        <option value="PROKTOR">PROKTOR</option>
        <option value="TEKNISI">TEKNISI</option>
        <option value="PENGAWAS">PENGAWAS</option>
        <option value="PANITIA">PANITIA</option>
        <option value="KEPALA SEKOLAH">KEPALA SEKOLAH</option>
        <option value="PESERTA">PESERTA</option>
      </select>

      <label for="foto">Upload Foto (JPG)</label>
      <input type="file" name="foto" id="foto" accept="image/*" required>

      <button type="submit" id="btnSubmit">Preview ID Card</button>
      <button type="button" id="btnDownload" style="display:none; background:#28a745;">Download PDF</button>

      <p style="margin-top: 1rem; font-size: 0.9rem; color: #555; text-align: center;">
        Silakan dicetak mandiri dan gunakan tempat ID Card mika ukuran <strong>B3 (95×124 mm)</strong>.
        <br>OTOMATIS unduh dalam format pdf. cek folder unduhan
        <br><br>
        <a href="https://s.shopee.co.id/4fllqQXScB" target="_blank">Beli Ukuran B3 di sini</a>
      </p>
    </form>

    <div id="status"></div>

    <div id="previewWrap">
      <h3 style="margin-bottom:.5rem;color:var(--primary-dark);font-size:1rem;">Preview Kartu</h3>
      <canvas id="previewCanvas"></canvas>
    </div>
  </div>

  <footer>
    By: <a href="https://www.youtube.com/@nirsinggih" target="_blank">Nir Singgih</a>
  </footer>

<script>
(function() {
  // === Konstanta ukuran kartu (mm) — sama dengan versi PHP ===
  const CARD_W = 95;
  const CARD_H = 124;

  // Resolusi preview di layar (px per mm)
  const PX_PER_MM = 4; // 95mm => 380px preview

  // Warna jabatan (RGB) — sama dengan versi PHP
  const JABATAN_COLORS = {
    'PROKTOR':        [153, 0, 0],
    'TEKNISI':        [255, 204, 204],
    'PENGAWAS':       [0, 51, 102],
    'PANITIA':        [0, 153, 0],
    'KEPALA SEKOLAH': [204, 153, 0],
    'PESERTA':        [128, 0, 128]
  };

  // Warna teks jabatan: TEKNISI pakai teks gelap, lainnya putih
  const JABATAN_TEXT_COLOR = {
    'TEKNISI': [0, 0, 0]
  };

  const $ = (id) => document.getElementById(id);
  const form = $('idcardForm');
  const previewWrap = $('previewWrap');
  const previewCanvas = $('previewCanvas');
  const statusEl = $('status');
  const btnDownload = $('btnDownload');
  const btnSubmit = $('btnSubmit');

  // State hasil preview untuk dipakai saat download
  let lastState = null;

  // === Utility: baca file sebagai Image ===
  function fileToImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { resolve({ img, url }); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  // === Utility: load background dari assets/background.jpg ===
  function loadBackground() {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('Background assets/background.jpg tidak ditemukan.'));
      img.src = 'assets/background.jpg';
    });
  }

  // === Utility: gambar foto bulat ke canvas ===
  // cropCenter + clip circle, output dataURL PNG
  function makeCirclePhoto(img, size) {
    // Siapkan square crop tengah
    const w = img.width, h = img.height;
    const side = Math.min(w, h);
    const sx = (w - side) / 2;
    const sy = (h - side) / 2;

    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const ctx = c.getContext('2d');

    ctx.save();
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
    ctx.restore();

    return c.toDataURL('image/png');
  }

  // === Render kartu ke canvas (dipakai untuk preview & PDF) ===
  // scale = px per mm
  async function renderCard(scale) {
    const nama = $('nama').value.trim();
    const sekolah = $('sekolah').value.trim().toUpperCase();
    const jabatan = $('jabatan').value.trim().toUpperCase();
    const logoFile = $('logo').files[0];
    const fotoFile = $('foto').files[0];

    if (!nama || !sekolah || !jabatan || !logoFile || !fotoFile) {
      throw new Error('Semua field wajib diisi.');
    }

    const bg = await loadBackground();
    const logo = await fileToImage(logoFile);
    const foto = await fileToImage(fotoFile);

    // Canvas ukuran kartu
    const c = document.createElement('canvas');
    c.width = Math.round(CARD_W * scale);
    c.height = Math.round(CARD_H * scale);
    const ctx = c.getContext('2d');

    // 1) Background kartu
    ctx.drawImage(bg, 0, 0, c.width, c.height);

    // 2) Logo di tengah atas
    const logoW = 11 * scale;
    const logoH = 11 * scale;
    const logoX = (c.width - logoW) / 2;
    const logoY = 8 * scale;
    // jaga rasio logo
    const lr = Math.min(logoW / logo.img.width, logoH / logo.img.height);
    const lw = logo.img.width * lr;
    const lh = logo.img.height * lr;
    ctx.drawImage(logo.img, logoX + (logoW - lw) / 2, logoY + (logoH - lh) / 2, lw, lh);

    // 3) Foto bulat
    const fotoSize = 45 * scale;
    const fotoX = 25 * scale;
    const fotoY = 38 * scale;
    const circleDataUrl = makeCirclePhoto(foto.img, Math.round(fotoSize * 2));
    const circleImg = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = rej;
      im.src = circleDataUrl;
    });
    ctx.drawImage(circleImg, fotoX, fotoY, fotoSize, fotoSize);

    // 4) Nama
    const namaFontSize = 11 * scale * 0.3528; // pt -> mm? Sebenarnya ukuran font di canvas pakai px.
    // Di PHP: font Arial 11pt. Di canvas, kita pakai px langsung supaya proporsional.
    // Konversi: 1pt = 1.333px pada 96dpi. Kita pakai pendekatan: ukuran font px = pt * (scale*0.3528) * (1/0.3528) = pt * scale? 
    // Lebih simpel: gunakan skala relatif terhadap mm. 11pt ≈ 3.88mm. Jadi font px = 3.88 * scale.
    const fontPx11 = 3.88 * scale;
    const fontPx14 = 4.94 * scale; // 14pt ≈ 4.94mm
    const fontPx10 = 3.53 * scale; // 10pt ≈ 3.53mm

    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `${fontPx11}px Helvetica, Arial, sans-serif`;
    const namaY = (89 + 3.5) * scale; // tengah cell 7mm tinggi mulai dari 89mm
    ctx.fillText(nama, c.width / 2, namaY);

    // 5) Jabatan (background pill warna + teks)
    const jabColor = JABATAN_COLORS[jabatan] || [200, 200, 200];
    const jabTextColor = JABATAN_TEXT_COLOR[jabatan] || [255, 255, 255];
    ctx.font = `bold ${fontPx14}px Helvetica, Arial, sans-serif`;
    const jabTextW = ctx.measureText(jabatan).width;
    const padX = 3 * scale;
    const jabBoxW = jabTextW + padX * 2;
    const jabBoxH = 8 * scale;
    const jabBoxX = (c.width - jabBoxW) / 2;
    const jabBoxY = 96 * scale;
    ctx.fillStyle = `rgb(${jabColor[0]},${jabColor[1]},${jabColor[2]})`;
    ctx.fillRect(jabBoxX, jabBoxY, jabBoxW, jabBoxH);
    ctx.fillStyle = `rgb(${jabTextColor[0]},${jabTextColor[1]},${jabTextColor[2]})`;
    ctx.fillText(jabatan, c.width / 2, jabBoxY + jabBoxH / 2);

    // 6) Nama sekolah
    ctx.font = `bold ${fontPx10}px Helvetica, Arial, sans-serif`;
    ctx.fillStyle = 'rgb(0,51,102)';
    const sekolahY = (jabBoxY / scale + 8 + 4) * scale; // y2 + 12 (cell 6mm) => tengah
    ctx.fillText(sekolah, c.width / 2, sekolahY);

    return {
      canvas: c,
      meta: { nama, sekolah, jabatan }
    };
  }

  // === Preview handler ===
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = 'Memproses preview...';
    btnDownload.style.display = 'none';
    try {
      const { canvas } = await renderCard(PX_PER_MM);
      previewCanvas.width = canvas.width;
      previewCanvas.height = canvas.height;
      const pctx = previewCanvas.getContext('2d');
      pctx.drawImage(canvas, 0, 0);
      previewWrap.classList.add('show');
      statusEl.textContent = 'Preview siap. Periksa hasil, lalu klik "Download PDF".';
      btnDownload.style.display = 'block';
      lastState = canvas;
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Error: ' + err.message;
      previewWrap.classList.remove('show');
    }
  });

  // === Download PDF handler ===
  btnDownload.addEventListener('click', async () => {
    if (!lastState) { statusEl.textContent = 'Silakan preview dulu.'; return; }
    statusEl.textContent = 'Membuat PDF...';
    btnDownload.disabled = true;
    try {
      const { jsPDF } = window.jspdf;

      // Render ulang di resolusi tinggi supaya PDF tajam (~ 300 dpi => 11.8 px/mm)
      const HI_SCALE = 11.8;
      const { canvas: hiCanvas, meta } = await renderCard(HI_SCALE);

      // jsPDF A4 portrait mm
      const pdf = new jsPDF('p', 'mm', 'a4');

      // Posisi kartu: sama dengan PHP (10,10)
      const startX = 10;
      const startY = 10;

      const imgData = hiCanvas.toDataURL('image/jpeg', 0.95);
      pdf.addImage(imgData, 'JPEG', startX, startY, CARD_W, CARD_H);

      // Garis potong
      const garisY = startY + CARD_H + 10;
      pdf.setDrawColor(150);
      pdf.line(10, garisY, 200, garisY);

      // Teks footer kecil
      pdf.setFont('Helvetica', 'italic');
      pdf.setFontSize(10);
      pdf.setTextColor(100);
      pdf.text('Potong di sini untuk menggunakan kertas kembali| Terhindar sifat boros | Cek Tinta | www.tasadmin.id', 5, garisY - 1.5);

      // Simpan
      const safeName = meta.nama.replace(/[^\w\-]+/g, '_');
      pdf.save('id_card_' + safeName + '.pdf');

      statusEl.textContent = 'PDF berhasil diunduh. Cek folder unduhan.';
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Error: ' + err.message;
    } finally {
      btnDownload.disabled = false;
    }
  });

  // Sembunyikan preview lama saat input berubah
  ['nama','sekolah','jabatan','logo','foto'].forEach(id => {
    $(id).addEventListener('input', () => {
      // tidak auto-hide, biarkan user tetap lihat preview terakhir
    });
  });
})();
</script>
</body>
</html>
