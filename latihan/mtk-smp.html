<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz TKA Matematika SMP</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container py-4">

    <div class="quiz-card">

        <div class="text-center mb-4">

            <div class="logo-box">

                <img
                    src="assets/logo.png"
                    alt="Logo Sekolah"
                    onerror="this.style.display='none'">

            </div>

            <h1 class="fw-bold text-primary mt-3">

                <i class="fa-solid fa-calculator"></i>

                Quiz TKA Matematika SMP

            </h1>

            <p class="text-muted mb-0">
                Tes Kemampuan Akademik – Matematika Jenjang SMP
            </p>

        </div>


        <div class="alert alert-info">

            <i class="fa-solid fa-circle-info"></i>

            Silakan isi identitas sebelum memulai quiz.

        </div>


        <form id="formIdentitas">

            <!-- NAMA -->

            <div class="mb-3">

                <label
                    for="nama"
                    class="form-label fw-bold">

                    Nama Siswa

                </label>

                <input
                    type="text"
                    id="nama"
                    class="form-control form-control-lg"
                    placeholder="Masukkan nama lengkap"
                    required>

            </div>


            <!-- SEKOLAH -->

            <div class="mb-3">

                <label
                    for="sekolah"
                    class="form-label fw-bold">

                    Asal Sekolah

                </label>

                <input
                    type="text"
                    id="sekolah"
                    class="form-control form-control-lg"
                    placeholder="Contoh: SMP Contoh 01"
                    required>

            </div>


            <!-- KELAS -->

            <div class="mb-3">

                <label
                    for="kelas"
                    class="form-label fw-bold">

                    Kelas

                </label>

                <input
                    type="text"
                    id="kelas"
                    class="form-control form-control-lg"
                    placeholder="Contoh: VI-B"
                    required>

                <div class="form-text">

                    Silakan isi kelas, misalnya IX-B, IX-A, atau IX-C.

                </div>

            </div>


            <!-- NOMOR PESERTA -->

            <div class="mb-4">

                <label
                    for="nomor"
                    class="form-label fw-bold">

                    Nomor Peserta

                </label>

                <input
                    type="text"
                    id="nomor"
                    class="form-control form-control-lg"
                    placeholder="Opsional">

            </div>


            <!-- TOMBOL -->

            <button
                type="submit"
                class="btn btn-primary btn-lg w-100">

                <i class="fa-solid fa-play"></i>

                Mulai Quiz

            </button>

        </form>

    </div>


    <div class="text-center mt-4 text-muted small">

        Quiz TKA Matematika SD

    </div>

</div>


<!--
    FILE SOAL KHUSUS MATEMATIKA SD
-->

<script>

    const FILE_SOAL = "data/mtk-smp.json";

</script>


<script src="js/app.js"></script>

</body>
</html>
