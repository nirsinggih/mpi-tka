<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz TKA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container py-4">

    <div class="quiz-card">

        <div class="text-center mb-4">

            <div class="logo-box">

                <img
                    src="assets/logo.png"
                    alt="Logo Sekolah"
                    onerror="this.style.display='none'">

            </div>

            <h1 class="fw-bold text-primary mt-3">

                <i class="fa-solid fa-graduation-cap"></i>

                Quiz TKA

            </h1>

            <p class="text-muted mb-0">
                Tes Kemampuan Akademik
            </p>

        </div>


        <div class="alert alert-info">

            <i class="fa-solid fa-circle-info"></i>

            Silakan isi identitas sebelum memulai quiz.

        </div>


        <form id="formIdentitas">

            <div class="mb-3">

                <label class="form-label fw-bold">
                    Nama Siswa
                </label>

                <input
                    type="text"
                    id="nama"
                    class="form-control form-control-lg"
                    placeholder="Masukkan nama lengkap"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label fw-bold">
                    Asal Sekolah
                </label>

                <input
                    type="text"
                    id="sekolah"
                    class="form-control form-control-lg"
                    placeholder="Contoh: SDN Contoh 01"
                    required>

            </div>


            <div class="mb-3">
  <label for="kelas" class="form-label">Kelas</label>
  <input 
    type="text" 
    id="kelas" 
    class="form-control" 
    placeholder="Contoh: VI-B"
    required
  >
  <div class="form-text">
    Silakan isi kelas, misalnya VI-B, VI-A.
  </div>
</div>


            <div class="mb-4">

                <label class="form-label fw-bold">
                    Nomor Peserta
                </label>

                <input
                    type="text"
                    id="nomor"
                    class="form-control form-control-lg"
                    placeholder="Opsional">

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-lg w-100">

                <i class="fa-solid fa-play"></i>

                Mulai Quiz

            </button>

        </form>

    </div>


    <div class="text-center mt-4 text-muted small">

        Quiz Pembelajaran Interaktif

    </div>

</div>


<script src="js/app.js"></script>

</body>
</html>
