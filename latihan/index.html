<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz TKA</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container py-4">

    <div class="quiz-card">

        <div class="text-center mb-4">

            <div class="logo-box">
                <img src="assets/logo.png"
                     alt="Logo Sekolah"
                     onerror="this.style.display='none'">
            </div>

            <h1 class="fw-bold text-primary mt-3">
                <i class="fa-solid fa-graduation-cap"></i>
                Quiz TKA
            </h1>

            <p class="text-muted mb-0">
                Tes Kemampuan Akademik
            </p>

        </div>

        <div class="alert alert-info">
            <i class="fa-solid fa-circle-info"></i>
            Silakan isi identitas terlebih dahulu sebelum memulai quiz.
        </div>

        <form id="formIdentitas">

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Nama Siswa
                </label>

                <input type="text"
                       id="nama"
                       class="form-control form-control-lg"
                       placeholder="Masukkan nama lengkap"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Asal Sekolah
                </label>

                <input type="text"
                       id="sekolah"
                       class="form-control form-control-lg"
                       placeholder="Contoh: SDN Contoh 01"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    Kelas
                </label>

                <select id="kelas"
                        class="form-select form-select-lg"
                        required>

                    <option value="">-- Pilih Kelas --</option>
                    <option value="I">Kelas I</option>
                    <option value="II">Kelas II</option>
                    <option value="III">Kelas III</option>
                    <option value="IV">Kelas IV</option>
                    <option value="V">Kelas V</option>
                    <option value="VI">Kelas VI</option>
                    <option value="VII">Kelas VII</option>
                    <option value="VIII">Kelas VIII</option>
                    <option value="IX">Kelas IX</option>

                </select>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">
                    Nomor Peserta
                </label>

                <input type="text"
                       id="nomor"
                       class="form-control form-control-lg"
                       placeholder="Opsional">
            </div>

            <button type="submit"
                    class="btn btn-primary btn-lg w-100">

                <i class="fa-solid fa-play"></i>
                Mulai Quiz

            </button>

        </form>

    </div>

    <div class="text-center mt-4 text-muted small">
        Quiz Pembelajaran Interaktif
    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
