<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Tes Kompetensi Akademik (TKA)</title>
    <!-- Menggunakan font Poppins untuk tampilan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 500px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            text-align: center;
        }

        .header-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            text-decoration: none;
            color: var(--text-main);
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .menu-item:hover, .menu-item:active {
            background-color: #EEF2FF;
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
        }

        .menu-icon {
            font-size: 20px;
            margin-right: 15px;
        }

        .menu-text {
            flex-grow: 1;
            text-align: left;
        }

        .arrow {
            color: var(--text-muted);
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .menu-item:hover .arrow, .menu-item:active .arrow {
            color: var(--primary);
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Animasi masuk perlahan */
        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container fade-in">
        <div class="header-icon">🎓</div>
        <h1>Latihan Tes Kompetensi Akademik (TKA)</h1>
        <p class="subtitle">Silakan pilih soal latihan yang tersedia di bawah ini untuk memulai.</p>

        <div class="menu-list">
            <!-- Matematika SD -->
            <a href="https://nirsinggih.github.io/mpi-tka/latihan/mtk-sd.html" class="menu-item">
                <span class="menu-icon">🧮</span>
                <span class="menu-text">Matematika SD</span>
                <span class="arrow">›</span>
            </a>

            <!-- Matematika SMP -->
            <a href="https://nirsinggih.github.io/mpi-tka/latihan/mtk-smp.html" class="menu-item">
                <span class="menu-icon">📐</span>
                <span class="menu-text">Matematika SMP</span>
                <span class="arrow">›</span>
            </a>

            <!-- Bahasa Indonesia SD -->
            <a href="https://nirsinggih.github.io/mpi-tka/latihan/b-ind-sd.html" class="menu-item">
                <span class="menu-icon">📖</span>
                <span class="menu-text">Bahasa Indonesia SD</span>
                <span class="arrow">›</span>
            </a>

            <!-- Bahasa Indonesia SMP -->
            <a href="https://nirsinggih.github.io/mpi-tka/latihan/b-ind-smp.html" class="menu-item">
                <span class="menu-icon">📝</span>
                <span class="menu-text">Bahasa Indonesia SMP</span>
                <span class="arrow">›</span>
            </a>
        </div>

        <footer>
            &copy; 2026 Modul Pembelajaran Interaktif
        </footer>
    </div>

</body>
</html>
