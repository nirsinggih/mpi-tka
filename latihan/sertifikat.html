<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sertifikat</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link rel="stylesheet"
      href="css/style.css">

</head>

<body>

<div class="container py-4">

    <div class="text-center mb-3 no-print">

        <button onclick="cetakSertifikat()"
                class="btn btn-primary">

            🖨 Cetak Sertifikat

        </button>

        <button onclick="downloadJPG()"
                class="btn btn-success">

            🖼 Download JPG

        </button>

    </div>


    <!-- AREA SERTIFIKAT -->

    <div id="sertifikat"
         class="sertifikat">

        <div class="sertifikat-border">

            <div class="sertifikat-content">

                <img src="assets/logo.png"
                     class="sertifikat-logo"
                     alt="Logo"
                     onerror="this.style.display='none'">

                <div class="sertifikat-title">
                    SERTIFIKAT
                </div>

                <div class="sertifikat-subtitle">
                    PENGHARGAAN
                </div>

                <p class="diberikan">
                    Diberikan kepada
                </p>

                <div id="sertifikatNama"
                     class="sertifikat-nama">
                    NAMA SISWA
                </div>

                <p class="sertifikat-text">
                    Kelas <strong id="sertifikatKelas"></strong>
                </p>

                <p class="sertifikat-text">
                    <strong id="sertifikatSekolah"></strong>
                </p>

                <p class="sertifikat-text mt-4">
                    Telah menyelesaikan Quiz
                </p>

                <h3 id="sertifikatQuiz">
                    Tes Kemampuan Akademik
                </h3>

                <div class="sertifikat-nilai">

                    <span>Nilai</span>

                    <strong id="sertifikatNilai">
                        0
                    </strong>

                </div>

                <div class="sertifikat-predikat"
                     id="sertifikatPredikat">
                    SANGAT BAIK
                </div>

                <div class="sertifikat-footer">

                    <div>
                        Nomor Peserta
                        <br>

                        <strong id="sertifikatNomor">
                            -
                        </strong>
                    </div>

                    <div>
                        Tanggal
                        <br>

                        <strong id="sertifikatTanggal">
                        </strong>
                    </div>

                </div>

                <div class="penandatangan">

                    <div>
                        Penyelenggara
                        <br><br><br>
                        ______________________
                    </div>

                </div>

                <div class="credit">
                    Quiz Pembelajaran Interaktif
                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script src="js/sertifikat.js"></script>

</body>
</html>
