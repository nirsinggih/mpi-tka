<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Hasil Quiz</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
      href="css/style.css">

</head>

<body>

<div class="container py-4">

    <div class="quiz-card text-center">

        <div class="result-icon">
            <i class="fa-solid fa-trophy"></i>
        </div>

        <h1 class="fw-bold text-primary">
            Quiz Selesai!
        </h1>

        <p class="text-muted">
            Berikut hasil pengerjaan quiz:
        </p>

        <hr>

        <div class="row text-start g-3">

            <div class="col-md-6">
                <div class="info-box">
                    <small>Nama Siswa</small>
                    <strong id="hasilNama"></strong>
                </div>
            </div>

            <div class="col-md-6">
                <div class="info-box">
                    <small>Asal Sekolah</small>
                    <strong id="hasilSekolah"></strong>
                </div>
            </div>

            <div class="col-md-4">
                <div class="info-box">
                    <small>Kelas</small>
                    <strong id="hasilKelas"></strong>
                </div>
            </div>

            <div class="col-md-4">
                <div class="info-box">
                    <small>Jumlah Soal</small>
                    <strong id="jumlahSoal"></strong>
                </div>
            </div>

            <div class="col-md-4">
                <div class="info-box">
                    <small>Benar</small>
                    <strong id="jumlahBenar"></strong>
                </div>
            </div>

        </div>

        <div class="nilai-box mt-4">

            <small>NILAI</small>

            <div id="nilai">
                0
            </div>

            <span id="predikat"
                  class="badge bg-success fs-6">
            </span>

        </div>

        <div class="mt-4 d-grid gap-2">

            <a href="sertifikat.html"
               class="btn btn-success btn-lg">

                <i class="fa-solid fa-certificate"></i>
                Lihat Sertifikat

            </a>

            <button onclick="ulangQuiz()"
                    class="btn btn-outline-primary">

                <i class="fa-solid fa-rotate-right"></i>
                Ulangi Quiz

            </button>

        </div>

    </div>

</div>

<script src="js/hasil.js"></script>

</body>
</html>
