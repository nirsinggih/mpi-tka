<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPI Bangun Datar SD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>Bangun Datar</h1>
      <p>Sifat, Rumus & Kuis — Matematika SD</p>
    </header>

    <nav class="nav-menu">
      <button class="nav-btn active" onclick="switchTab('materi')">📖 Materi</button>
      <button class="nav-btn" onclick="switchTab('kalkulator')">🧮 Kalkulator</button>
      <button class="nav-btn" onclick="switchTab('kuis')">✏️ Kuis</button>
    </nav>

    <main class="content">
      <!-- Section 1: Materi & Sifat-Sifat -->
      <section id="materi" class="tab-content active">
        <div class="card">
          <h2>Pilih Bangun Datar</h2>
          <div class="shape-selector">
            <button class="shape-btn active" onclick="showShapeDetail('persegi')">Persegi</button>
            <button class="shape-btn" onclick="showShapeDetail('persegiPanjang')">Persegi Panjang</button>
            <button class="shape-btn" onclick="showShapeDetail('segitiga')">Segitiga</button>
            <button class="shape-btn" onclick="showShapeDetail('lingkaran')">Lingkaran</button>
            <button class="shape-btn" onclick="showShapeDetail('jajarGenjang')">Jajar Genjang</button>
            <button class="shape-btn" onclick="showShapeDetail('trapesium')">Trapesium</button>
          </div>
        </div>

        <div class="card" id="shapeDetailCard">
          <!-- Detail materi diisi dinamis via JS -->
        </div>
      </section>

      <!-- Section 2: Kalkulator Luas & Keliling -->
      <section id="kalkulator" class="tab-content">
        <div class="card">
          <h2>Hitung Luas & Keliling</h2>
          <div class="input-group">
            <label for="calcShapeSelect">Pilih Bangun Datar:</label>
            <select id="calcShapeSelect" onchange="renderCalcForm()">
              <option value="persegi">Persegi</option>
              <option value="persegiPanjang">Persegi Panjang</option>
              <option value="segitiga">Segitiga (Sama Sisi)</option>
              <option value="lingkaran">Lingkaran</option>
            </select>
          </div>

          <div class="sub-card" id="calcInputsContainer">
            <!-- Form input dinamis -->
          </div>

          <div class="result-box" id="calcResultContainer">
            <h3>Hasil Perhitungan:</h3>
            <p id="calcLuasText">Luas (L): -</p>
            <p id="calcKelilingText">Keliling (K): -</p>
          </div>
        </div>
      </section>

      <!-- Section 3: Kuis -->
      <section id="kuis" class="tab-content">
        <div class="card" id="quizContainer">
          <div class="quiz-header">
            <span id="questionNum">Soal 1 dari 4</span>
          </div>
          <p id="questionText" class="question">Loading...</p>
          <div id="optionsContainer" class="options-group"></div>
          <div id="quizFeedback" class="feedback"></div>
          <button id="nextBtn" class="action-btn" onclick="nextQuestion()" style="display: none;">Soal Berikutnya ➡️</button>
        </div>

        <div class="card" id="scoreContainer" style="display: none;">
          <h2>Hasil Kuis Kamu 🎉</h2>
          <div class="score-box">
            <span id="finalScore">0</span>
          </div>
          <p id="scoreMessage" style="text-align: center;"></p>
          <button class="action-btn" onclick="resetQuiz()">Ulangi Kuis 🔄</button>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
